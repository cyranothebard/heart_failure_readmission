[tool:pytest]
# Heart Failure Readmission Prediction - Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --durations=10

# Markers for different test types
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests for component interactions
    clinical: Clinical validation tests
    performance: Performance and load tests
    slow: Tests that take longer to run
    healthcare: Healthcare-specific validation tests
    data: Data processing and validation tests
    model: Model training and evaluation tests

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*
    ignore::UserWarning:sklearn.*
    ignore::UserWarning:xgboost.*

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */migrations/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
title = Heart Failure Readmission Prediction Coverage Report

[coverage:xml]
output = coverage.xml
